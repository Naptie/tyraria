name: Deploy
on:
  push:
  workflow_dispatch:

jobs:
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Set up Tinymist
        run: |
          cd ..
          git clone -b tinymist-wasm https://github.com/ParaN3xus/tinymist.git
          cd tinymist/crates/tinymist
          yarn
          yarn build
          cd pkg
          yarn link

      - name: Install dependencies
        run: |
          yarn

      - name: Build project
        run: |
          yarn link tinymist
          BUILD_PATH=/tyraria yarn build

      - name: Deploy to Vercel
        env:
          VERCEL_JSON: ${{ secrets.VERCEL_JSON }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          echo $VERCEL_JSON > .vercel/project.json
          npx vercel --prod --token $VERCEL_TOKEN
